<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFB6A3">
<title>우리 아기 이유식 노트</title>
<style>
:root{
  --bg:#FFF9F5; --card:#FFFFFF; --ink:#3E3A38; --sub:#8C8480;
  --line:#F0E6DF; --peach:#FF9E7D; --peach-d:#F2734B;
  --mint:#7ED0B8; --lav:#A9A0E0; --sun:#FFC861;
  --early:#8FD3C7; --mid:#FFC861; --late:#FF9E7D; --final:#A9A0E0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;padding-bottom:78px}
#app{max-width:520px;margin:0 auto;min-height:100vh}
h1,h2,h3,h4{margin:0;line-height:1.35}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px}

/* ── 온보딩 ── */
#onboard{padding:52px 24px;text-align:center}
#onboard .hero{font-size:64px;margin-bottom:8px}
#onboard h1{font-size:24px;margin-bottom:6px}
#onboard p.sub{color:var(--sub);font-size:14px;margin:0 0 32px}
.field{text-align:left;margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:7px}
.field input,.field select{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none}
.field input:focus{border-color:var(--peach)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--peach);color:#fff;font-weight:800;font-size:16px}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#fff;color:var(--peach-d);border:1.5px solid var(--peach)}
.btn.sm{padding:10px;font-size:14px;border-radius:11px}

/* ── 헤더 ── */
header{padding:20px 18px 14px;background:linear-gradient(160deg,#FFE7DC,#FFF9F5)}
.hgreet{font-size:12px;color:var(--peach-d);font-weight:800;letter-spacing:.4px}
.hname{font-size:22px;font-weight:800;margin:2px 0 2px}
.hage{font-size:13px;color:var(--sub)}
.stagepill{display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800;color:#fff;margin-top:9px}

/* ── 공통 ── */
main{padding:14px 14px 20px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(180,150,130,.07)}
.sect{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.6px;margin:20px 4px 9px}
.sect:first-child{margin-top:4px}
.row{display:flex;gap:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tag{display:inline-block;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:700;background:#F7F1EC;color:var(--sub)}
.tag.p{background:#FFEDE4;color:var(--peach-d)}
.tag.m{background:#E4F6F0;color:#2E9C7D}
.tag.v{background:#EEEBFB;color:#6B5FC7}
.muted{color:var(--sub);font-size:13px}
.hr{height:1px;background:var(--line);margin:13px 0}

/* 진행바 */
.pbar{height:9px;border-radius:9px;background:#F1E7E0;overflow:hidden;margin:11px 0 5px}
.pbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--mint),var(--sun),var(--peach))}

/* 로드맵 */
.rm{position:relative;padding-left:26px}
.rm:before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.rmi{position:relative;margin-bottom:15px}
.rmi:last-child{margin-bottom:0}
.rmi .dot{position:absolute;left:-24px;top:4px;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid var(--line)}
.rmi.done .dot{background:var(--mint);border-color:var(--mint)}
.rmi.now .dot{background:var(--peach);border-color:var(--peach);box-shadow:0 0 0 5px rgba(255,158,125,.22)}
.rmi h4{font-size:14.5px}
.rmi .when{font-size:11.5px;color:var(--sub);font-weight:700}
.rmi.now h4{color:var(--peach-d)}
.rmi ul{margin:5px 0 0;padding-left:16px;font-size:13px;color:var(--sub)}

/* 단계 탭 */
.stab{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding:2px}
.stab button{flex:0 0 auto;padding:9px 14px;border-radius:12px;background:#fff;font-size:13px;font-weight:700;
  color:var(--sub);border:1.5px solid var(--line)}
.stab button.on{color:#fff;border-color:transparent}
.ttab{display:flex;gap:6px;margin:0 0 12px}
.ttab button{flex:1;padding:9px;border-radius:11px;background:#F5EFEA;font-size:13px;font-weight:700;color:var(--sub)}
.ttab button.on{background:var(--ink);color:#fff}

/* 레시피 카드 */
.rc{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:13px;margin-bottom:9px;
  box-shadow:0 2px 8px rgba(180,150,130,.07);width:100%;text-align:left}
.rc .emo{font-size:30px;flex:0 0 42px;text-align:center}
.rc .nm{font-weight:800;font-size:15px}
.rc .ds{font-size:12px;color:var(--sub);margin-top:2px}
.rc .ar{color:#DDD2CA;font-size:20px}

/* 재료 도감 */
.ing{background:#fff;border-radius:14px;padding:11px 8px;text-align:center;box-shadow:0 2px 8px rgba(180,150,130,.06)}
.ing .e{font-size:26px}
.ing .n{font-size:12.5px;font-weight:700;margin-top:3px}
.ing .m{font-size:10.5px;color:var(--sub)}
.ing.locked{opacity:.42}
.ing .ok{font-size:10px;color:#2E9C7D;font-weight:800}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(50,40,35,.5);z-index:60;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:.22s}
.modal.on{opacity:1;pointer-events:auto}
.msheet{background:var(--bg);width:100%;max-width:520px;margin:0 auto;max-height:90vh;overflow-y:auto;
  border-radius:24px 24px 0 0;padding:8px 16px 34px;transform:translateY(30px);transition:.22s}
.modal.on .msheet{transform:none}
.mgrab{width:42px;height:4px;border-radius:4px;background:#E2D6CE;margin:6px auto 14px}
.mtitle{font-size:20px;font-weight:800}
.stepl{counter-reset:s;padding:0;margin:0;list-style:none}
.stepl li{counter-increment:s;position:relative;padding-left:32px;margin-bottom:11px;font-size:14px}
.stepl li:before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;
  background:var(--peach);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ingrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ingrow:last-child{border:none}
.ingrow b{font-weight:800}
.qbox{display:flex;align-items:center;gap:10px;background:#fff;border-radius:13px;padding:10px 13px;margin-bottom:11px}
.qbox button{width:32px;height:32px;border-radius:9px;background:#F5EFEA;font-weight:800;color:var(--peach-d)}
.tipbox{background:#FFF6EC;border-left:3px solid var(--sun);border-radius:10px;padding:11px 13px;font-size:13.5px}
.warn{background:#FFEFEC;border-left:3px solid #FF7A5C;border-radius:10px;padding:11px 13px;font-size:13.5px}

/* 기록 */
.logi{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.logi:last-child{border:none}
.logi .rx{font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:8px 12px;border-radius:20px;background:#F5EFEA;font-size:13px;font-weight:700;color:var(--sub)}
.chips button.on{background:var(--peach);color:#fff}

/* 하단 내비 */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
nav>div{max-width:520px;margin:0 auto;width:100%;display:flex}
nav button{flex:1;padding:9px 0 8px;font-size:10.5px;font-weight:700;color:#C3B7AF}
nav button i{display:block;font-size:21px;font-style:normal;margin-bottom:1px}
nav button.on{color:var(--peach-d)}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <!-- 온보딩 -->
  <section id="onboard">
    <div class="hero">🍼</div>
    <h1>우리 아기 이유식 노트</h1>
    <p class="sub">아기 정보를 입력하면 개월수에 맞는<br>이유식 경로와 메뉴를 추천해 드려요</p>
    <div class="field"><label>아기 이름 (또는 태명)</label><input id="inName" placeholder="예: 하윤"></div>
    <div class="field"><label>태어난 날</label><input id="inBirth" type="date"></div>
    <div class="field"><label>수유 방식 <span style="font-weight:400">(시작 시기 안내용)</span></label>
      <select id="inFeed"><option value="breast">모유 위주</option><option value="formula">분유 위주</option><option value="mix">혼합</option></select></div>
    <button class="btn" onclick="saveBaby()">시작하기</button>
    <p class="muted" style="margin-top:18px;font-size:11.5px">입력한 정보는 이 기기에만 저장되며 외부로 전송되지 않습니다.</p>
  </section>

  <!-- 메인 -->
  <section id="main" class="hide">
    <header id="hdr"></header>
    <main id="view"></main>
  </section>
</div>

<nav id="nav" class="hide"><div>
  <button data-t="home" class="on"><i>🏠</i>홈</button>
  <button data-t="stage"><i>🍲</i>단계별</button>
  <button data-t="food"><i>🥕</i>재료</button>
  <button data-t="log"><i>📝</i>기록</button>
  <button data-t="rule"><i>📖</i>원칙</button>
</div></nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeM()">
  <div class="msheet"><div class="mgrab"></div><div id="mbody"></div></div>
</div>

<script>
/* ══════════════════════════════════════════════
   1. 데이터
══════════════════════════════════════════════ */
const STAGES = [
 {id:'ready', name:'준비기', label:'~ 만 6개월', from:0, to:6, color:'#B9AFA8',
  ratio:'-', count:'수유만', amount:'-', texture:'-',
  desc:'아직 이유식을 시작하지 않는 시기예요. 목을 잘 가누고, 앉혀두면 상체를 유지하고, 어른 음식에 관심을 보이면 준비가 된 신호입니다.',
  todo:['만 4개월 이전 이유식 시작은 권하지 않아요','턱받이·아기 숟가락·이유식 그릇 미리 준비','생후 6개월부터 컵으로 물 연습 시작할 예정']},
 {id:'early', name:'초기', label:'만 6 ~ 7개월', from:6, to:7, color:'#8FD3C7',
  ratio:'10배죽 (불린쌀 1 : 물 10)', count:'하루 1회 → 2주 후 2회', amount:'1회 30~80g', texture:'곱게 갈아 체에 내린 미음',
  desc:'쌀미음으로 시작해 고기·채소를 빠르게 더해가는 시기. "알레르기가 걱정돼서 늦춘다"보다 조금씩 다양하게 경험시키는 편이 좋습니다.',
  todo:['첫날은 1~2 숟갈(5~10g)로 시작','오전 수유 전, 배고플 때 먹이기','새 재료는 한 가지씩 2~3일 관찰','철분 위해 소고기를 초기부터 매일 소량','간(소금·설탕) 절대 금지']},
 {id:'mid', name:'중기', label:'만 7 ~ 9개월', from:7, to:9, color:'#FFC861',
  ratio:'7배죽 (불린쌀 1 : 물 7)', count:'하루 2~3회', amount:'1회 80~120g', texture:'2~3mm로 잘게 다진 무른 죽',
  desc:'입자를 키워 씹는 연습을 시작합니다. 미음 단계에 오래 머물면 씹기 발달이 늦어질 수 있어 과감히 진행하세요.',
  todo:['체에 걸르지 않고 잘게 다져서 주기','달걀·생선·두부 등 단백질 확대','컵으로 물 마시기 연습','이유식 → 수유 순서로, 시간 정해서 먹이기','30분 넘으면 미련 없이 치우기']},
 {id:'late', name:'후기', label:'만 9 ~ 12개월', from:9, to:12, color:'#FF9E7D',
  ratio:'5배죽 → 진밥 (쌀 1 : 물 5~4)', count:'하루 3회 + 간식 1~2회', amount:'1회 120~180g', texture:'0.5cm 정도, 진밥 형태',
  desc:'하루 세 끼 리듬이 자리 잡는 시기. 손으로 집어먹는 핑거푸드를 꼭 함께 주어 스스로 먹는 연습을 시켜주세요.',
  todo:['핑거푸드 매일 한 가지 (지저분해도 허용!)','숟가락 스스로 쥐어보게 하기','젖병 대신 컵 비중 늘리기','간식은 과일·고구마 등, 정해진 시간에','우유(생우유)는 아직 → 돌 이후']},
 {id:'final', name:'완료기', label:'만 12개월 ~', from:12, to:99, color:'#A9A0E0',
  ratio:'밥 (진밥 → 된밥)', count:'하루 3회 식사 + 간식 2회', amount:'어른 1/3 정도', texture:'어른과 비슷하게, 작게 썰어',
  desc:'밥과 반찬 중심의 유아식으로 넘어갑니다. 가족과 같은 상에서 함께 먹는 경험이 중요합니다.',
  todo:['생우유 시작 (하루 400~500ml 이내)','젖병 떼기 완료 목표','꿀은 돌 이후부터 가능','간은 여전히 최소한으로','안 먹는다고 쫓아다니며 먹이지 않기']}
];

/* 레시피: q=수량(배수 계산용) */
const RECIPES = [
/* ─── 초기 · 죽 ─── */
{id:'e1',s:'early',t:'porridge',n:'첫 쌀미음 (10배죽)',e:'🍚',time:'20분',bad:'첫 이유식',
 ing:[{n:'불린 쌀',q:15,u:'g',note:'쌀가루 10g으로 대체 가능'},{n:'물',q:150,u:'ml'}],
 st:['쌀을 30분 이상 불려 체에 건집니다.','불린 쌀과 물을 믹서에 넣고 아주 곱게 갈아줍니다.','냄비에 붓고 약불에서 계속 저으며 8~10분 끓입니다.','고운 체에 한 번 걸러 매끈하게 만듭니다.','체온 정도(미지근)로 식혀 숟가락으로 먹입니다.'],
 tip:'첫날은 1~2숟갈(5~10g)만. 3~5일에 걸쳐 양을 늘려가세요. 3~4일 이상 쌀미음만 주다 지체하지 말고 바로 고기·채소를 추가하는 게 좋습니다.'},
{id:'e2',s:'early',t:'porridge',n:'소고기미음',e:'🥩',time:'30분',bad:'철분 보충 필수 메뉴',
 ing:[{n:'불린 쌀',q:15,u:'g'},{n:'소고기 (안심·우둔)',q:10,u:'g'},{n:'물',q:170,u:'ml'}],
 st:['소고기는 찬물에 15분 담가 핏물을 빼줍니다.','끓는 물에 소고기를 삶고, 삶은 물(육수)은 따로 둡니다.','삶은 고기를 아주 곱게 갈거나 다집니다.','불린 쌀 + 육수 + 물을 갈아 냄비에 넣고 끓입니다.','고기를 넣고 5분 더 끓인 뒤 체에 걸러 마무리합니다.'],
 tip:'생후 6개월 이후 모유·분유만으로는 철분이 부족해집니다. 고기는 초기부터 매일 조금씩 주는 것이 좋습니다.'},
{id:'e3',s:'early',t:'porridge',n:'소고기애호박미음',e:'🥒',time:'30분',bad:'초기 인기 조합',
 ing:[{n:'불린 쌀',q:15,u:'g'},{n:'소고기',q:10,u:'g'},{n:'애호박',q:10,u:'g',note:'껍질·씨 제거'},{n:'물',q:170,u:'ml'}],
 st:['애호박은 껍질과 씨를 제거하고 속살만 사용합니다.','소고기는 핏물 빼고 삶아 곱게 갑니다.','애호박은 살짝 찐 후 곱게 갈아둡니다.','불린 쌀과 육수를 갈아 냄비에서 8분 끓입니다.','고기·애호박을 넣고 3~5분 더 끓인 뒤 체에 내립니다.'],
 tip:'애호박은 초기에 소화가 잘 되고 거부가 적은 채소예요. 껍질은 꼭 벗겨주세요.'},
{id:'e4',s:'early',t:'porridge',n:'소고기브로콜리미음',e:'🥦',time:'30분',bad:'',
 ing:[{n:'불린 쌀',q:15,u:'g'},{n:'소고기',q:10,u:'g'},{n:'브로콜리 (꽃 부분)',q:8,u:'g'},{n:'물',q:170,u:'ml'}],
 st:['브로콜리는 꽃 부분만 떼어 물에 담가 씻습니다.','끓는 물에 2~3분 데쳐 곱게 갈아줍니다.','소고기는 삶아 곱게 갈고 육수는 남겨둡니다.','불린 쌀+육수를 갈아 냄비에서 8분 끓입니다.','재료를 모두 넣고 3분 더 끓여 체에 내립니다.'],
 tip:'줄기는 질겨서 초기에는 꽃 부분만 사용하세요.'},
{id:'e5',s:'early',t:'porridge',n:'감자미음 / 단호박미음',e:'🥔',time:'25분',bad:'달아서 잘 먹어요',

══════════════════════════════════════════════ */
const d0=s=>{const d=new Date(s);d.setHours(0,0,0,0);return d};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function ageMonths(){ // 소수 개월
  const b=d0(baby.birth),n=today();
  let m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());
  if(n.getDate()<b.getDate())m--;
  const anchor=addM(b,m);
  const days=Math.floor((n-anchor)/86400000);
  return m+days/30;
}
function addM(d,m){const x=new Date(d);const day=x.getDate();x.setMonth(x.getMonth()+m);if(x.getDate()<day)x.setDate(0);return x}
const days=()=>Math.floor((today()-d0(baby.birth))/86400000);
const fmt=d=>`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
function ageText(){
  const m=Math.floor(ageMonths()), b=d0(baby.birth);
  const dd=Math.floor((today()-addM(b,m))/86400000);
  return `생후 ${days()}일 · 만 ${m}개월 ${dd}일`;
}
const curStage=()=>{const m=ageMonths();return STAGES.find(s=>m>=s.from&&m<s.to)||STAGES[0]};

function saveBaby(){
  const n=document.getElementById('inName').value.trim();
  const b=document.getElementById('inBirth').value;
  const f=document.getElementById('inFeed').value;
  if(!n){alert('아기 이름을 입력해 주세요');return}
  if(!b){alert('태어난 날을 선택해 주세요');return}
  if(d0(b)>today()){alert('오늘 이후 날짜는 선택할 수 없어요');return}
  baby={name:n,birth:b,feed:f};save();boot();
}
function boot(){
  if(!baby){document.getElementById('onboard').classList.remove('hide');
    document.getElementById('main').classList.add('hide');
    document.getElementById('nav').classList.add('hide');return}
  document.getElementById('onboard').classList.add('hide');
  document.getElementById('main').classList.remove('hide');
  document.getElementById('nav').classList.remove('hide');
  if(!selStage)selStage=curStage().id==='ready'?'early':curStage().id;
  render();
}

    return `<div class="rmi ${cls}"><div class="dot"></div>
      <div class="when">만 ${x.m}개월 · ${fmt(x.date)} ${x.dday>0?`<span style="color:var(--peach-d)">D-${x.dday}</span>`:''}</div>
      <h4>${x.title}</h4>
      <ul>${x.todo.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;

}

  document.getElementById('mbody').innerHTML=`
   <div style="font-size:44px;text-align:center">${f.e}</div>
   <div class="mtitle" style="text-align:center">${f.n}</div>
   <div style="text-align:center;margin:6px 0 16px">
     <span class="tag m">${f.c}</span><span class="tag ${m>=f.m?'p':''}">${f.m}개월부터</span>
     ${f.al?'<span class="tag v">알레르기 주의</span>':''}</div>
   <div class="card">${f.d}</div>
   ${m<f.m?`<div class="warn">아직 이른 재료예요. <b>${fmt(addM(d0(baby.birth),f.m))}</b>(만 ${f.m}개월) 이후에 시도해 보세요.</div>`:''}
   ${f.warn?`<div class="warn" style="margin-top:10px">⚠️ 특별히 주의가 필요한 식품입니다. 위 설명을 꼭 확인하세요.</div>`:''}
   <div class="sect">우리 아기 반응 기록</div>
   <div class="card">
     <div class="chips">
       ${[['ok','😊 잘 먹었어요'],['watch','😐 관찰 중'],['bad','😖 반응 있었어요']].map(x=>
        `<button class="${t.st===x[0]?'on':''}" onclick="setF('${f.n.replace(/'/g,"\\'")}','${x[0]}')">${x[1]}</button>`).join('')}
     </div>
     ${t.date?`<p class="muted" style="margin:10px 0 0;font-size:12.5px">첫 시도: ${t.date}</p>`:''}
     ${t.st==='bad'?'<div class="warn" style="margin-top:10px">호흡 곤란·얼굴 부기·심한 구토가 있으면 즉시 병원에 가세요. 경미한 발진도 사진과 함께 기록해 두었다가 소아과에 보여주세요.</div>':''}
   </div>
   ${(()=>{const rs=RECIPES.filter(r=>r.ing.some(i=>i.n.includes(f.n.split(' ')[0])));
     return rs.length?`<div class="sect">이 재료로 만드는 메뉴</div>${rs.map(rcard).join('')}`:''})()}
   <button class="btn ghost" style="margin-top:8px" onclick="closeM()">닫기</button>`;
  document.getElementById('modal').classList.add('on');document.body.style.overflow='hidden';
}
function setF(n,st){
  tried[n]=tried[n]||{date:fmt(today())};
  tried[n].st=tried[n].st===st?null:st;
  if(!tried[n].st)delete tried[n];save();openF(n);
}

/* ── 기록 ── */
let lRx='😋';
function vLog(){
  const byDate={};logs.slice().reverse().forEach(l=>{(byDate[l.d]=byDate[l.d]||[]).push(l)});
  const s=curStage();
  const opts=RECIPES.filter(r=>r.s===(s.id==='ready'?'early':s.id));
  return `
  <div class="card">
    <b style="font-size:15px">📝 오늘 먹은 기록 추가</b>
    <div class="field" style="margin:12px 0 10px"><label>메뉴</label>
      <input id="lgName" list="lgList" placeholder="메뉴명을 입력하거나 선택">
      <datalist id="lgList">${opts.map(r=>`<option value="${r.n}">`).join('')}</datalist></div>
    <div class="row">
      <div class="field" style="flex:1;margin:0"><label>먹은 양(g)</label><input id="lgAmt" type="number" placeholder="예: 80"></div>
      <div class="field" style="flex:1;margin:0"><label>시간</label>
        <select id="lgTime"><option>아침</option><option>점심</option><option>저녁</option><option>간식</option></select></div>
    </div>
    <div class="field" style="margin:14px 0 12px"><label>반응</label>
      <div class="chips">${['😋','😐','😖'].map(x=>`<button class="${lRx===x?'on':''}" onclick="lRx='${x}';render()">${x}</button>`).join('')}</div></div>
    <button class="btn" onclick="addLog()">기록 저장</button>
  </div>
  <div class="sect">지난 기록 ${logs.length?`(${logs.length})`:''}</div>
  ${logs.length?Object.keys(byDate).map(d=>`<div class="card">
    <b style="font-size:13.5px;color:var(--peach-d)">${d}</b>
    ${byDate[d].map((l,i)=>`<div class="logi">
      <div class="rx">${l.rx}</div>
      <div style="flex:1"><b style="font-size:14px">${esc(l.n)}</b>
      <div class="muted" style="font-size:12px">${l.t}${l.a?` · ${l.a}g`:''}</div></div>
      <button class="muted" style="font-size:18px;padding:4px 8px" onclick="delLog('${l.id}')">×</button></div>`).join('')}
    </div>`).join(''):'<div class="card muted">아직 기록이 없어요. 첫 이유식을 기록해 보세요!</div>'}
  ${logs.length?`<button class="btn ghost sm" style="margin-top:6px" onclick="exportCsv()">기록 내보내기 (CSV)</button>`:''}`;
}
function addLog(){
  const n=document.getElementById('lgName').value.trim();
  if(!n){alert('메뉴명을 입력해 주세요');return}
  logs.push({id:Date.now()+'',d:fmt(today()),n,a:document.getElementById('lgAmt').value,
    t:document.getElementById('lgTime').value,rx:lRx});
  save();render();
}
function quickLog(id){
  const r=RECIPES.find(x=>x.id===id);
  logs.push({id:Date.now()+'',d:fmt(today()),n:r.n,a:'',t:'식사',rx:'😋'});
  save();closeM();tab='log';render();
}
function delLog(id){logs=logs.filter(l=>l.id!==id);save();render()}
function exportCsv(){
  const csv='날짜,시간,메뉴,양(g),반응\n'+logs.map(l=>`${l.d},${l.t},"${l.n}",${l.a||''},${l.rx}`).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download=`${baby.name}_이유식기록.csv`;a.click();
}

/* ── 원칙 ── */
function vRule(){
  return `
  <div class="card" style="background:#FFF6EC">
    <b>📖 이유식 기본 원칙</b>
    <p class="muted" style="margin:6px 0 0;font-size:12.5px">널리 알려진 소아과적 이유식 원칙(하정훈 선생님 육아법 기준)을 정리한 내용입니다.
    책의 문장을 그대로 옮긴 것이 아니므로, 자세한 내용은 원서와 담당 소아과에서 확인해 주세요.</p></div>
  ${RULES.map((r,i)=>`<div class="card"><b style="font-size:15px">${i+1}. ${r.t}</b>
    <p class="muted" style="margin:6px 0 0">${r.d}</p></div>`).join('')}
  <div class="sect">단계별 요약표</div>
  <div class="card" style="font-size:13px">
    ${STAGES.filter(s=>s.id!=='ready').map(s=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <b style="color:${s.color==='#FFC861'?'#B07C13':s.color}">${s.name} · ${s.label}</b>
      <div class="muted" style="font-size:12.5px">${s.ratio} · ${s.count} · ${s.amount}</div></div>`).join('')}
  </div>
  <div class="sect">아기 정보</div>
  <div class="card">
    <div class="ingrow"><span>이름</span><b>${esc(baby.name)}</b></div>
    <div class="ingrow"><span>생일</span><b>${fmt(d0(baby.birth))}</b></div>
    <div class="ingrow"><span>나이</span><b>${ageText()}</b></div>
    <div class="ingrow"><span>수유</span><b>${{breast:'모유 위주',formula:'분유 위주',mix:'혼합'}[baby.feed]||'-'}</b></div>
    <button class="btn ghost sm" style="margin-top:12px" onclick="editBaby()">아기 정보 수정</button>
    <button class="btn ghost sm" style="margin-top:8px;border-color:#E9DDD6;color:var(--sub)" onclick="resetAll()">전체 데이터 초기화</button>
  </div>`;
}
function editBaby(){
  const n=prompt('아기 이름',baby.name);if(n===null)return;
  const b=prompt('생년월일 (YYYY-MM-DD)',baby.birth);if(b===null)return;
  if(isNaN(d0(b))){alert('날짜 형식이 올바르지 않습니다');return}
  baby.name=n.trim()||baby.name;baby.birth=b;save();render();
}
function resetAll(){
  if(!confirm('모든 기록과 아기 정보가 삭제됩니다. 계속할까요?'))return;
  localStorage.removeItem(K.b);localStorage.removeItem(K.l);localStorage.removeItem(K.f);
  baby=null;logs=[];tried={};location.reload();
}
boot();
</script>
</body>
</html>
