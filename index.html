<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#FFB6A3">
<title>우리 아기 이유식 노트</title><style>
:root{--bg:#FFF9F5;--ink:#3E3A38;--sub:#8C8480;--ln:#F0E6DF;--pc:#FF9E7D;--pd:#F2734B;--mt:#7ED0B8;--lv:#A9A0E0;--sn:#FFC861;--rd:#EF6A4C;--bl:#7FA8D9;--nw:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
#wrap{padding-left:var(--nw);padding-top:env(safe-area-inset-top);min-height:100vh}
body.solo{--nw:0px}
#app{max-width:560px;margin:0 auto;padding-bottom:40px}
h1,h4{margin:0;line-height:1.35}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--pd);word-break:break-all}
nav{position:fixed;left:0;top:0;bottom:0;width:var(--nw);background:#fff;border-right:1px solid var(--ln);z-index:40;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 0 12px;gap:1px;overflow-y:auto}
nav button{width:53px;padding:8px 0 6px;border-radius:12px;font-size:9px;font-weight:800;color:#BDB1A9;line-height:1.15}
nav button i{display:block;font-size:19px;font-style:normal;margin-bottom:1px}
nav button.on{color:#fff;background:var(--pc)}
nav .lg{font-size:19px;margin-bottom:5px}
#ob{padding:32px 20px 60px;text-align:center;max-width:440px;margin:0 auto}
.fd{text-align:left;margin-bottom:11px}
.fd label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:4px}
.fd input,.fd select,.fd textarea{width:100%;padding:11px;border:1.5px solid var(--ln);border-radius:12px;background:#fff;outline:none}
.fd input:focus,.fd textarea:focus{border-color:var(--pc)}
.fd input[type=date],.fd input[type=number],.fd input[type=text],.fd select{height:46px}
.fd input[type=date]{-webkit-appearance:none;appearance:none;padding:0 12px;line-height:44px;min-width:0}
.fd select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238C8480' stroke-width='1.6' fill='none'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
.btn{display:block;width:100%;padding:13px;border-radius:13px;background:var(--pc);color:#fff;font-weight:800}
.btn.g{background:#fff;color:var(--pd);border:1.5px solid var(--pc)}
.btn.y{background:#fff;color:var(--sub);border:1.5px solid var(--ln)}
.btn.s{padding:9px;font-size:13px;border-radius:11px}
header{padding:15px 15px 12px;background:linear-gradient(160deg,#FFE7DC,#FFF9F5)}
.hg{font-size:11px;color:var(--pd);font-weight:800}
.hn{font-size:20px;font-weight:800;margin:2px 0}
.ha{font-size:12px;color:var(--sub)}
.pl{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;color:#fff;margin-top:6px}
main{padding:11px 11px 24px}
.cd{background:#fff;border-radius:16px;padding:13px;margin-bottom:10px;box-shadow:0 2px 10px rgba(180,150,130,.08)}
.st{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.4px;margin:16px 4px 7px}
.rw{display:flex;gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tg{display:inline-block;padding:2px 7px;border-radius:7px;font-size:10px;font-weight:700;background:#F7F1EC;color:var(--sub);margin:1px}
.tg.p{background:#FFEDE4;color:var(--pd)}.tg.m{background:#E4F6F0;color:#2E9C7D}
.tg.v{background:#EEEBFB;color:#6B5FC7}.tg.r{background:#FDEAE5;color:var(--rd)}
.mu{color:var(--sub);font-size:12px}
.hr{height:1px;background:var(--ln);margin:10px 0}
.sb2{height:13px;border-radius:13px;background:#F1E7E0;overflow:hidden;display:flex;position:relative;margin-top:4px}
.sb2 i{display:block;height:100%}
.sb2 u{position:absolute;top:-3px;width:2px;height:19px;background:#3E3A38;opacity:.4}
.lgd{display:flex;gap:11px;font-size:10px;color:var(--sub);margin-top:7px;flex-wrap:wrap}
.lgd b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:3px;vertical-align:middle}
.rm{position:relative;padding-left:23px}
.rm:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--ln)}
.ri{position:relative;margin-bottom:12px}
.ri .dt{position:absolute;left:-22px;top:4px;width:13px;height:13px;border-radius:50%;background:#fff;border:2.5px solid var(--ln)}
.ri.dn .dt{background:var(--mt);border-color:var(--mt)}
.ri.nw2 .dt{background:var(--pc);border-color:var(--pc);box-shadow:0 0 0 5px rgba(255,158,125,.22)}
.ri h4{font-size:13.5px}
.ri .wh{font-size:10.5px;color:var(--sub);font-weight:700}
.ri.nw2 h4{color:var(--pd)}
.ri ul{margin:3px 0 0;padding-left:15px;font-size:12px;color:var(--sub)}
.tab{display:flex;gap:5px;margin-bottom:9px;overflow-x:auto;padding:2px}
.tab button{flex:0 0 auto;padding:8px 12px;border-radius:11px;background:#fff;font-size:12.5px;font-weight:700;color:var(--sub);border:1.5px solid var(--ln)}
.tab button.on{color:#fff;border-color:transparent;background:var(--ink)}
.tt{display:flex;gap:5px;margin-bottom:9px}
.tt button{flex:1;padding:9px 2px;border-radius:11px;background:#F5EFEA;font-size:11.5px;font-weight:700;color:var(--sub)}
.tt button.on{background:var(--ink);color:#fff}
.rc{display:flex;gap:9px;align-items:center;background:#fff;border-radius:14px;padding:9px;margin-bottom:7px;box-shadow:0 2px 8px rgba(180,150,130,.08);width:100%;text-align:left}
.rc .th{flex:0 0 48px;height:48px;border-radius:11px;overflow:hidden;background:#FBF6F2}
.rc .th img,.rc .th svg{width:100%;height:100%;object-fit:cover;display:block}
.rc .nm{font-weight:800;font-size:13.5px}
.rc .ds{font-size:10.5px;color:var(--sub);margin-top:1px}
.rc .ar{color:#DDD2CA;font-size:18px}
.ig{background:#fff;border-radius:12px;padding:9px 3px;text-align:center;box-shadow:0 2px 8px rgba(180,150,130,.07)}
.ig .e{font-size:23px}.ig .n{font-size:11px;font-weight:700}.ig .m{font-size:9px;color:var(--sub)}
.ig.lk{opacity:.4}.ig .ok{font-size:9px;color:#2E9C7D;font-weight:800}
.md{position:fixed;inset:0;background:rgba(50,40,35,.5);z-index:60;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.2s}
.md.on{opacity:1;pointer-events:auto}
.sh{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 13px 40px;transform:translateY(24px);transition:.2s}
.md.on .sh{transform:none}
.gb{width:40px;height:4px;border-radius:4px;background:#E2D6CE;margin:6px auto 11px}
.mt2{font-size:18px;font-weight:800}
.sl{padding:0;margin:0;list-style:none}
.sl li{display:flex;gap:8px;margin-bottom:11px}
.sl .no{flex:0 0 21px;height:21px;border-radius:50%;background:var(--pc);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:14px}
.sl .ar2{flex:0 0 82px}
.sl .bx{width:82px;height:62px;border-radius:10px;overflow:hidden;border:1px solid var(--ln);background:#fff}
.sl .bx img,.sl .bx svg{width:100%;height:100%;object-fit:cover;display:block}
.sl .p2{display:flex;gap:3px;margin-top:3px}
.sl .p2 button{flex:1;font-size:9px;color:var(--bl);font-weight:700;padding:4px 0;background:#F1F5FA;border-radius:6px}
.sl .p2 button.d{flex:0 0 21px;color:var(--sub);background:#F5EFEA}
.sl .tx{flex:1;font-size:13px;padding-top:9px}
.ir{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--ln);font-size:12.5px}
.ir:last-child{border:none}
.qb{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px 11px;margin-bottom:9px}
.qb button{width:31px;height:31px;border-radius:9px;background:#F5EFEA;font-weight:800;color:var(--pd)}
.tp{background:#FFF6EC;border-left:3px solid var(--sn);border-radius:10px;padding:10px;font-size:12.5px}
.wn{background:#FFEFEC;border-left:3px solid var(--rd);border-radius:10px;padding:10px;font-size:12.5px}
.sb{background:#F3F6FA;border-left:3px solid var(--bl);border-radius:10px;padding:10px;font-size:12px}
.fe{background:#FFF1EE;border-left:3px solid var(--rd);border-radius:10px;padding:10px;font-size:12px}
.lg2{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.lg2:last-child{border:none}
.ch{display:flex;gap:5px;flex-wrap:wrap}
.ch button{padding:7px 11px;border-radius:19px;background:#F5EFEA;font-size:12px;font-weight:700;color:var(--sub)}
.ch button.on{background:var(--pc);color:#fff}
.cb{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.cb:last-child{border:none}
.sp{display:flex;align-items:center;gap:5px}
.sp button{width:27px;height:27px;border-radius:8px;background:#F5EFEA;font-weight:800;color:var(--pd)}
.tb{width:100%;border-collapse:collapse;font-size:11px}
.tb th,.tb td{padding:5px 2px;border-bottom:1px solid var(--ln);text-align:right}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb th{color:var(--sub);font-size:10px}
.ei{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.ei input,.ei select{padding:9px 5px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;outline:none;font-size:13px;min-width:0}
.sc{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.sc .bx2{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.sc.on .bx2{background:var(--mt);border-color:var(--mt)}
.sc.on .nm2{text-decoration:line-through;color:var(--sub)}
.wk{width:100%;border-collapse:separate;border-spacing:3px;font-size:10.5px}
.wk td,.wk th{padding:5px 2px;border-radius:8px;text-align:center;vertical-align:middle}
.wk th{background:#F5EFEA;color:var(--sub);font-size:10px;font-weight:800}
.wk td{background:#fff;line-height:1.3}
.wk td.tdy{outline:2px solid var(--pc)}
.wk .mn{font-weight:700;font-size:10px;display:block}
.mlk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mlk button{padding:11px 0;border-radius:11px;background:#EEF4FB;color:#4B7CB5;font-weight:800;font-size:13px}
.gc{width:100%;height:auto;display:block;background:#fff;border-radius:12px}
.pill2{display:inline-block;padding:3px 9px;border-radius:14px;font-size:11px;font-weight:800}
.hd{display:none!important}
code{background:#F2EDE8;padding:1px 4px;border-radius:5px;font-size:11.5px}
@media(max-width:360px){:root{--nw:52px}nav button{width:46px;font-size:8.5px}nav button i{font-size:17px}}
@media(min-width:900px){:root{--nw:86px}nav button{width:74px;font-size:10px}}
</style></head><body>
