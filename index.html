+(rs.length?'<div class="st">이 재료로 만드는 메뉴</div>'+rs.map(function(r){return rcard(r)}).join(''):'')
+'<button class="btn y" onclick="closeM()">닫기</button>';
document.getElementById('md').classList.add('on');document.body.style.overflow='hidden'}
function startObs(n){obs.push({id:'o'+Date.now(),n:n,dt:ymd(TD()),c:[0,0,0],m:'',done:0});save();askNoti();closeM();tab='food';render()}
function setF(n,s){tried[n]=tried[n]===s?null:s;if(!tried[n])delete tried[n];save();openF(n);render()}
/*==== 기록 ====*/
function vLog(){var by={};logs.slice().reverse().forEach(function(l){(by[l.d]=by[l.d]||[]).push(l)});
var si=IDS.indexOf(curS().id==='ready'?'early':curS().id),op=RCP().filter(function(r){return r.s===si});
return '<div class="cd"><b style="font-size:15px">📝 먹은 기록</b>'
+'<div class="fd" style="margin:12px 0 10px"><label>메뉴</label><input id="gN" list="gL" placeholder="메뉴명 입력 또는 선택"><datalist id="gL">'+op.map(function(r){return '<option>'+esc(r.n)+'</option>'}).join('')+'</datalist></div>'
+'<div class="rw"><div class="fd" style="flex:1;margin:0"><label>먹은 양(g)</label><input id="gA" type="number" placeholder="80"></div><div class="fd" style="flex:1;margin:0"><label>시간</label><select id="gT">'+SLOTS().concat(['간식']).map(function(s){return '<option>'+s+'</option>'}).join('')+'</select></div></div>'
+'<div class="fd" style="margin:12px 0 10px"><label>반응</label><div class="ch">'+['😋','😐','😖'].map(function(x){return '<button class="'+(lRx===x?'on':'')+'" onclick="lRx=\''+x+'\';render()">'+x+'</button>'}).join('')+'</div></div>'
+'<button class="btn" onclick="addLog()">기록 저장</button></div>'
+'<div class="st">지난 기록 '+(logs.length?'('+logs.length+')':'')+'</div>'
+(logs.length?Object.keys(by).map(function(d){var s={kcal:0,p:0,fe:0,ca:0,zn:0};by[d].forEach(function(l){NK.forEach(function(k){s[k]+=(l.nu&&l.nu[k])||0})});
return '<div class="cd"><div class="rw" style="justify-content:space-between"><b style="font-size:13px;color:var(--pd)">'+d+'</b><span class="mu" style="font-size:10.5px">'+Math.round(s.kcal)+'kcal · 철 '+rnd(s.fe)+'mg</span></div>'+by[d].map(function(l){
return '<div class="lg"><div style="font-size:19px">'+l.rx+'</div><div style="flex:1"><b style="font-size:13.5px">'+esc(l.n)+'</b><div class="mu" style="font-size:10.5px">'+l.t+(l.a?' · '+l.a+'g':'')+(l.nu?' · 철 '+rnd(l.nu.fe)+'mg':'')+'</div></div><button class="mu" style="font-size:16px;padding:2px 6px" onclick="delLog(\''+l.id+'\')">✕</button></div>'}).join('')+'</div>'}).join('')
:'<div class="cd mu">아직 기록이 없어요.</div>')
+(logs.length?'<button class="btn y s" onclick="csv()">CSV로 내보내기</button>':'')}
function addLog(){var n=document.getElementById('gN').value.trim();if(!n)return alert('메뉴명을 입력해 주세요');
var r=null;RCP().forEach(function(x){if(x.n===n)r=x});var amt=document.getElementById('gA').value;
var nu=r?nutOf(r).t:null;
if(nu&&amt){var base=0;(r.g||[]).forEach(function(x){base+=gOf(x)});base=base/(r.sv||1);if(base>0){var f=amt/base;var n2={};NK.forEach(function(k){n2[k]=nu[k]*f});nu=n2}}
logs.push({id:''+Date.now(),d:fmt(TD()),n:n,a:amt,t:document.getElementById('gT').value,rx:lRx,nu:nu});save();render()}
function qLog(id){var r=getR(id);logs.push({id:''+Date.now(),d:fmt(TD()),n:r.n,a:'',t:'식사',rx:'😋',nu:nutOf(r).t});save();closeM();tab='log';render()}
function delLog(id){logs=logs.filter(function(l){return l.id!==id});save();render()}
function csv(){var s='날짜,시간,메뉴,양(g),반응,열량,단백질,철,칼슘,아연\n'+logs.map(function(l){var n=l.nu||{};
return [l.d,l.t,'"'+l.n+'"',l.a||'',l.rx,rnd(n.kcal||0),rnd(n.p||0),rnd(n.fe||0),rnd(n.ca||0),rnd(n.zn||0)].join(',')}).join('\n');
dl(new Blob(['\ufeff'+s],{type:'text/csv'}),baby.name+'_이유식기록.csv')}
function dl(b,fn){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;a.click()}
/*==== 정보 ====*/
function vInfo(){return '<div class="cd"><b>⚙️ 식사 설정</b><div class="fd" style="margin:10px 0 0"><label>하루 이유식 끼니 수</label><select onchange="baby.meals=+this.value;todaySel=null;plan=null;save();render()">'+[1,2,3].map(function(n){return '<option value="'+n+'" '+(MEALS()===n?'selected':'')+'>'+n+'끼</option>'}).join('')+'</select></div><p class="mu" style="margin:8px 0 0">끼니 수를 바꾸면 오늘 추천과 주간 식단이 다시 편성됩니다. 현재 '+curS().n+'는 <b>'+curS().ct+'</b>가 일반적입니다.</p></div>'
+'<div class="cd" style="background:#FFF6EC"><b>📖 이유식 기본 원칙</b><p class="mu" style="margin:6px 0 0;font-size:11px">널리 알려진 소아과적 원칙과 공공 지침을 정리한 내용입니다. 책 문장을 그대로 옮긴 것이 아니므로 원서와 담당 소아과에서 확인해 주세요.</p></div>'
+RL.map(function(r,i){return '<div class="cd"><b style="font-size:14px">'+(i+1)+'. '+r[0]+'</b><p class="mu" style="margin:5px 0 7px">'+r[2]+'</p>'+r[1].map(sT).join('')+'</div>'}).join('')
+'<div class="st">단계별 요약 · 영양 목표 비중</div><div class="cd" style="font-size:12.5px">'+STG.slice(1).map(function(s){return '<div style="padding:8px 0;border-bottom:1px solid var(--ln)"><b style="color:'+(s.c==='#FFC861'?'#B07C13':s.c)+'">'+s.n+' · '+s.lb+'</b><div class="mu" style="font-size:11.5px">'+s.ra+' · '+s.ct+' · '+s.am+' · 이유식이 하루 영양의 약 '+Math.round(s.sf*100)+'% 담당</div></div>'}).join('')+'<div class="mu" style="font-size:10.5px;margin-top:6px">※ 담당 비중은 일반적 수유량을 감안한 앱의 계산 기준입니다.</div></div>'
+'<div class="st">전체 출처</div><div class="cd">'+Object.keys(SRC).map(function(k){return '<div style="padding:8px 0;border-bottom:1px solid var(--ln)"><span class="tg v">'+SRC[k].t+'</span><b style="display:block;font-size:13px;margin:3px 0">'+SRC[k].n+'</b><div class="mu" style="font-size:11.5px">'+SRC[k].d+'</div><a style="font-size:11px" href="'+SRC[k].u+'" target="_blank" rel="noopener">'+SRC[k].u+'</a></div>'}).join('')+'</div>'
+'<div class="st">백업 · 아빠 폰 공유</div><div class="cd"><p class="mu" style="margin:0 0 10px">백업 파일을 카톡으로 보내고 상대 폰에서 불러오면 아기 정보·기록·나의 메뉴·큐브·사진·식단이 그대로 옮겨집니다.</p><button class="btn g s" onclick="expJ()">⬇ 백업 내보내기 (.json)</button><button class="btn g s" style="margin-top:8px" onclick="document.getElementById(\'fj\').click()">⬆ 백업 불러오기</button></div>'
+'<div class="st">아기 정보</div><div class="cd"><div class="ir"><span>이름</span><b>'+esc(baby.name)+'</b></div><div class="ir"><span>생일</span><b>'+fmt(d0(baby.birth))+'</b></div><div class="ir"><span>나이</span><b>'+ageT()+'</b></div><div class="ir"><span>수유</span><b>'+({b:'모유 위주',f:'분유 위주',m:'혼합'}[baby.feed]||'-')+'</b></div><div class="ir"><span>하루 끼니</span><b>'+MEALS()+'끼</b></div>'
+'<button class="btn g s" style="margin-top:12px" onclick="editBaby()">아기 정보 수정</button><button class="btn y s" style="margin-top:8px" onclick="resetAll()">전체 초기화</button></div>'
+'<p class="mu" style="text-align:center;font-size:10.5px;margin:14px 6px 0">본 앱은 의료 행위를 대체하지 않습니다. 알레르기·성장에 관한 판단은 담당 소아과와 상의하세요.</p>'}
function expJ(){dl(new Blob([JSON.stringify({v:4,baby:baby,logs:logs,tried:tried,my:myR,cubes:cubes,ov:ov,ph:ph,plan:plan,obs:obs})],{type:'application/json'}),baby.name+'_이유식노트_백업.json')}
document.getElementById('fj').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
r.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(!confirm('현재 데이터를 덮어씁니다. 계속할까요?'))return;
baby=d.baby||baby;logs=d.logs||[];tried=d.tried||{};myR=d.my||[];cubes=d.cubes||[];ov=d.ov||{};ph=d.ph||{};plan=d.plan||null;obs=d.obs||[];
save();alert('불러오기 완료!');boot()}catch(err){alert('파일을 읽을 수 없습니다.')}};r.readAsText(f);e.target.value=''});
function editBaby(){var n=prompt('아기 이름',baby.name);if(n===null)return;var b=prompt('생년월일 (YYYY-MM-DD)',baby.birth);if(b===null)return;
if(isNaN(d0(b)))return alert('날짜 형식 오류');baby.name=n.trim()||baby.name;baby.birth=b;todaySel=null;plan=null;save();render()}
function resetAll(){if(!confirm('모든 데이터가 삭제됩니다. 계속할까요?'))return;for(var k in KY)localStorage.removeItem(KY[k]);location.reload()}
boot();
</script></body></html>
